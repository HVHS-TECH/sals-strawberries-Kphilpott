<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sal’s Strawberry Saloon</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width">
  <link rel="icon" type="image/x-icon" href="assets/images/dtec_favicon.png">

  <link href="style.css" rel="stylesheet" type="text/css" />

  <!-- firebase start ****************************************-->
  <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
  <!-- firebase end ******************************************-->
  <script src="fb_setup.js"></script>
  <script src="fb_io.js"></script>
  <script src="script.js"></script>
</head>
<body>
  <div class="container">
    <h1>Europa Quality Starships</h1>
    <h2>A Luna Industries Subdivision</h2>
    <p id="ThankYou"></p>
    <button id="Login" onclick="fb_login()">Login with Google</button><button id="Logout" style="display: none;" onclick="fb_logout()">Logout</button>

    <form id="shipForm">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="favoriteFruit">Ship to Order:</label>
      <input type="text" id="ShipOrder" name="favoriteFruit" required />

      <label for="fruitQuantity">How many ships do you require?</label>
      <input type="number" id="shipQuantity" name="fruitQuantity" required />

      <!-- add more fields here -->
    </form>

    <button id="submit" style="display: none;" onclick="fb_write()">Submit</button>

    <p id="statusMessage"></p>
  </div>
</body>
</html>
